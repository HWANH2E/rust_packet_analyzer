[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parser",
    "crates/capture",
    "crates/cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["packet-analyzer contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
